const CATEGORIES = {
  FP:     { name: "FleetPride (Donaldson Strategic)", color: "#dc2626" },
  OEM:    { name: "Truck OEM Dealer (Class 7/8)",     color: "#2563eb" },
  HEQ:    { name: "Heavy Equipment Dealer",            color: "#16a34a" },
  PARTS:  { name: "Independent Parts Distributor",     color: "#ea580c" },
  LEASE:  { name: "Fleet Leasing (Ryder/Penske)",      color: "#9333ea" },
  TIRE:   { name: "Tire &amp; Service Chain",              color: "#eab308" },
  RENTAL: { name: "Equipment Rental",                  color: "#0d9488" },
  REPAIR: { name: "Independent Diesel Repair",         color: "#7c2d12" },
};

// Init map centered on Donaldson territory
const map = L.map('map', {
  center: [32.3, -83.5],
  zoom: 7,
  minZoom: 5, maxZoom: 18,
});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

// State
const activeCategories = new Set(Object.keys(CATEGORIES));
let searchTerm = "";
let markers = {};       // id -> Leaflet marker
let cluster = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  maxClusterRadius: 50,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let size = count < 10 ? 34 : count < 50 ? 42 : 52;
    return L.divIcon({
      html: `<div style="background:#1e3a5f;color:white;border-radius:50%;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);">${count}</div>`,
      className: 'cluster-icon', iconSize: [size, size]
    });
  }
});
map.addLayer(cluster);

// Build markers
LOCATIONS.forEach((loc, i) => {
  loc._id = i;
  const cat = CATEGORIES[loc.c];
  const icon = L.divIcon({
    className: 'custom-marker',
    html: `<div style="background:${cat.color};width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8]
  });
  const marker = L.marker([loc.lat, loc.lng], { icon });
  const stars = loc.r ? '★'.repeat(Math.round(loc.r)) + '☆'.repeat(5 - Math.round(loc.r)) : '';
  const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`;
  const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;
  marker.bindPopup(`
    <div class="popup-badge" style="background:${cat.color};">${cat.name}</div>
    <div class="popup-name">${loc.n}</div>
    <div class="popup-sub">${loc.sub}</div>
    <div class="popup-row"><strong>📍</strong> ${loc.addr}</div>
    ${loc.ph ? `<div class="popup-row"><strong>📞</strong> <a href="tel:${loc.ph}">${loc.ph}</a></div>` : ''}
    ${loc.r ? `<div class="popup-row"><strong>⭐</strong> <span class="rating-stars">${stars}</span> ${loc.r} (${loc.rc} reviews)</div>` : ''}
    <div class="popup-actions">
      <a href="${gmapsUrl}" target="_blank">Open in Maps</a>
      <a href="${dirUrl}" target="_blank" class="secondary">Directions</a>
    </div>
  `, { maxWidth: 320 });
  markers[i] = marker;
});

// Filter panel
function renderFilters() {
  const catCounts = {};
  Object.keys(CATEGORIES).forEach(k => catCounts[k] = 0);
  LOCATIONS.forEach(l => catCounts[l.c]++);
  const container = document.getElementById('filters');
  container.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const item = document.createElement('label');
    item.className = 'filter-item';
    item.innerHTML = `
      <input type="checkbox" ${activeCategories.has(key) ? 'checked' : ''} data-cat="${key}">
      <span class="swatch" style="background:${cat.color}"></span>
      <span>${cat.name}</span>
      <span class="count">${catCounts[key]}</span>
    `;
    item.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) activeCategories.add(key);
      else activeCategories.delete(key);
      applyFilters();
    });
    container.appendChild(item);
  });

  // Legend
  const legend = document.getElementById('legend-items');
  legend.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.name}`;
    legend.appendChild(row);
  });
}

document.getElementById('select-all').onclick = () => {
  Object.keys(CATEGORIES).forEach(k => activeCategories.add(k));
  renderFilters(); applyFilters();
};
document.getElementById('select-none').onclick = () => {
  activeCategories.clear();
  renderFilters(); applyFilters();
};

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  applyFilters();
});

function matchesFilter(loc) {
  if (!activeCategories.has(loc.c)) return false;
  if (!searchTerm) return true;
  const hay = `${loc.n} ${loc.sub} ${loc.addr} ${loc.ph}`.toLowerCase();
  return hay.includes(searchTerm);
}

function applyFilters() {
  cluster.clearLayers();
  const visible = [];
  LOCATIONS.forEach(l => {
    if (matchesFilter(l)) {
      cluster.addLayer(markers[l._id]);
      visible.push(l);
    }
  });
  document.getElementById('visible-count').textContent = visible.length;
  renderList(visible);
}

function renderList(visible) {
  visible.sort((a, b) => {
    if (a.c !== b.c) return Object.keys(CATEGORIES).indexOf(a.c) - Object.keys(CATEGORIES).indexOf(b.c);
    return a.n.localeCompare(b.n);
  });
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  visible.forEach(loc => {
    const cat = CATEGORIES[loc.c];
    const item = document.createElement('div');
    item.className = 'location-item';
    item.dataset.id = loc._id;
    item.innerHTML = `
      <div class="name"><span class="badge" style="background:${cat.color}">${loc.c}</span>${loc.n}</div>
      <div class="sub">${loc.sub}</div>
      <div class="addr">${loc.addr}</div>
    `;
    item.onclick = () => {
      map.setView([loc.lat, loc.lng], 14, { animate: true });
      setTimeout(() => markers[loc._id].openPopup(), 400);
      document.querySelectorAll('.location-item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    };
    container.appendChild(item);
  });
}

// CSV export
function exportCSV() {
  const rows = [['Name','Category','Sub-Type','Address','Latitude','Longitude','Phone','Rating','Review Count']];
  LOCATIONS.forEach(l => {
    if (matchesFilter(l)) {
      rows.push([l.n, CATEGORIES[l.c].name, l.sub, l.addr, l.lat, l.lng, l.ph || '', l.r || '', l.rc || '']);
    }
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'donaldson_territory_locations.csv';
  a.click();
}

// Init
document.getElementById('total-count').textContent = LOCATIONS.length;
renderFilters();
applyFilters();

// Expose export for the button (which is outside initApp scope)
window.exportCSV = exportCSV;
} // end initApp

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
